name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  engine:
    name: SEO engine tests
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          mapfile -t PYFILES < <(git ls-files 'scripts/*.py')
          python3 -m py_compile "${PYFILES[@]}"
          echo "All ${#PYFILES[@]} scripts passed syntax check"

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade "pip>=26.2.2"
          python -m pip install -r requirements.txt pytest

      - name: Run pytest
        run: pytest tests/ -v

  dungeon:
    name: Dungeon build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dungeon/package-lock.json

      - name: Install dungeon deps
        run: npm ci
        working-directory: dungeon

      - name: Test ZIP startup and shutdown
        run: npm run test:launcher
        working-directory: dungeon

      - name: Test CLI launcher
        run: npm run test:cli
        working-directory: dungeon

      - name: Test text runtime adapters
        run: npm run test:runtimes
        working-directory: dungeon

      - name: Test runtime policy
        run: npm run test:policy
        working-directory: dungeon

      - name: Build dungeon
        run: npm run build
        working-directory: dungeon

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check release privacy and local artifacts
        run: python scripts/release_privacy_check.py
